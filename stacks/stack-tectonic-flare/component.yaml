apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: stack-tectonic

spec:
  type: publish-stack
  domain: platform-stack
  subscribe:
    environments:
      - name: dev
        profile: dry-run
      - name: staging
        profile: release
      - name: production
        profile: release
  inputs:
    name: stack-tectonic-flare
  labels:
    layer: platform
    provider: orun
